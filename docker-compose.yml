# =====================================================================
# TANVIONROYALE — Local development infrastructure
# Postgres + Redis for the monorepo. Services are for LOCAL DEV only.
# NOTE: Docker is not currently installed on the primary dev machine;
# this file can be run wherever Docker Desktop/Engine is available.
# =====================================================================

name: tanvion-royale

services:
  postgres:
    image: postgres:16-alpine
    container_name: tanvionroyale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tanvionroyale
      POSTGRES_PASSWORD: tanvionroyale
      POSTGRES_DB: tanvionroyale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tanvionroyale -d tanvionroyale"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tanvionroyale-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata: