<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1b1536" />
      <stop offset="50%" stop-color="#0c0d1c" />
      <stop offset="100%" stop-color="#05060b" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)" />

  <!-- Gold Aura -->
  <circle cx="400" cy="380" r="340" fill="url(#goldGlow)" />

  <!-- Outer Wheel Rim -->
  <circle cx="400" cy="380" r="280" fill="#18110b" stroke="url(#goldGrad)" stroke-width="12" />
  <circle cx="400" cy="380" r="260" fill="none" stroke="#2c2219" stroke-width="8" />

  <!-- Metallic Ball Track -->
  <circle cx="400" cy="380" r="240" fill="#242938" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Wheel Rotor Segments (37 Pockets Simulation) -->
  <g transform="translate(400, 380)">
    <!-- Alternating Pockets -->
    <!-- Red pockets -->
    <path d="M 0 0 L 0 -220 A 220 220 0 0 1 37.3 -216.8 Z" fill="#e11d48" stroke="#d4af37" stroke-width="1" />
    <path d="M 0 0 L 73.5 -207.3 A 220 220 0 0 1 107.5 -191.9 Z" fill="#e11d48" stroke="#d4af37" stroke-width="1" />
    <path d="M 0 0 L 138.4 -170.8 A 220 220 0 0 1 165.1 -145 Z" fill="#e11d48" stroke="#d4af37" stroke-width="1" />
    <path d="M 0 0 L 186.7 -115.6 A 220 220 0 0 1 202.9 -83.5 Z" fill="#e11d48" stroke="#d4af37" stroke-width="1" />
    <path d="M 0 0 L 213 -49.6 A 220 220 0 0 1 216.8 -14.6 Z" fill="#e11d48" stroke="#d4af37" stroke-width="1" />
    <path d="M 0 0 L 214.2 21 A 220 220 0 0 1 205 55.7 Z" fill="#e11d48" stroke="#d4af37" stroke-width="1" />
    <path d="M 0 0 L 189.6 89.2 A 220 220 0 0 1 168.2 120.3 Z" fill="#e11d48" stroke="#d4af37" stroke-width="1" />
    <path d="M 0 0 L 141.4 148.1 A 220 220 0 0 1 110.3 172.5 Z" fill="#e11d48" stroke="#d4af37" stroke-width="1" />
    <!-- Black pockets -->
    <path d="M 0 0 L 37.3 -216.8 A 220 220 0 0 1 73.5 -207.3 Z" fill="#18181b" stroke="#d4af37" stroke-width="1" />
    <path d="M 0 0 L 107.5 -191.9 A 220 220 0 0 1 138.4 -170.8 Z" fill="#18181b" stroke="#d4af37" stroke-width="1" />
    <path d="M 0 0 L 165.1 -145 A 220 220 0 0 1 186.7 -115.6 Z" fill="#18181b" stroke="#d4af37" stroke-width="1" />
    <path d="M 0 0 L 202.9 -83.5 A 220 220 0 0 1 213 -49.6 Z" fill="#18181b" stroke="#d4af37" stroke-width="1" />
    <path d="M 0 0 L 216.8 -14.6 A 220 220 0 0 1 214.2 21 Z" fill="#18181b" stroke="#d4af37" stroke-width="1" />
    <path d="M 0 0 L 205 55.7 A 220 220 0 0 1 189.6 89.2 Z" fill="#18181b" stroke="#d4af37" stroke-width="1" />
    <path d="M 0 0 L 168.2 120.3 A 220 220 0 0 1 141.4 148.1 Z" fill="#18181b" stroke="#d4af37" stroke-width="1" />
    <!-- Green 0 pocket -->
    <path d="M 0 0 L -37.3 -216.8 A 220 220 0 0 1 0 -220 Z" fill="#059669" stroke="#d4af37" stroke-width="1" />

    <!-- Mirror pockets on left side -->
    <g transform="scale(-1, 1)">
      <path d="M 0 0 L 37.3 -216.8 A 220 220 0 0 1 73.5 -207.3 Z" fill="#e11d48" stroke="#d4af37" stroke-width="1" />
      <path d="M 0 0 L 73.5 -207.3 A 220 220 0 0 1 107.5 -191.9 Z" fill="#18181b" stroke="#d4af37" stroke-width="1" />
      <path d="M 0 0 L 107.5 -191.9 A 220 220 0 0 1 138.4 -170.8 Z" fill="#e11d48" stroke="#d4af37" stroke-width="1" />
      <path d="M 0 0 L 138.4 -170.8 A 220 220 0 0 1 165.1 -145 Z" fill="#18181b" stroke="#d4af37" stroke-width="1" />
      <path d="M 0 0 L 165.1 -145 A 220 220 0 0 1 186.7 -115.6 Z" fill="#e11d48" stroke="#d4af37" stroke-width="1" />
      <path d="M 0 0 L 186.7 -115.6 A 220 220 0 0 1 202.9 -83.5 Z" fill="#18181b" stroke="#d4af37" stroke-width="1" />
      <path d="M 0 0 L 202.9 -83.5 A 220 220 0 0 1 213 -49.6 Z" fill="#e11d48" stroke="#d4af37" stroke-width="1" />
      <path d="M 0 0 L 213 -49.6 A 220 220 0 0 1 216.8 -14.6 Z" fill="#18181b" stroke="#d4af37" stroke-width="1" />
    </g>

    <!-- Inner Cone Bowl -->
    <circle cx="0" cy="0" r="140" fill="url(#metalGrad)" stroke="url(#goldGrad)" stroke-width="6" />

    <!-- Center Brass Turret -->
    <circle cx="0" cy="0" r="50" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="4" />
    <!-- Turret 4-arm cross -->
    <rect x="-65" y="-6" width="130" height="12" rx="6" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1" />
    <rect x="-6" y="-65" width="12" height="130" rx="6" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1" />
    <circle cx="0" cy="0" r="22" fill="#fff" opacity="0.9" filter="url(#neon)" />
    <circle cx="0" cy="0" r="16" fill="url(#goldGrad)" />

    <!-- Ivory Ball with Glow -->
    <circle cx="160" cy="-140" r="14" fill="#ffffff" filter="url(#neon)" />
    <circle cx="160" cy="-140" r="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- Title Badge HUD Overlay -->
  <g transform="translate(400, 680)">
    <!-- Background Pill -->
    <rect x="-260" y="-55" width="520" height="110" rx="24" fill="#090e1a" stroke="url(#goldGrad)" stroke-width="3" filter="url(#neon)" />
    <!-- Text -->
    <text x="0" y="-10" font-family="sans-serif" font-weight="900" font-size="44" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
      ROYALE TIME
    </text>
    <text x="0" y="28" font-family="sans-serif" font-weight="800" font-size="16" fill="#38bdf8" text-anchor="middle" letter-spacing="6">
      SPEED AUTO-ROULETTE
    </text>
  </g>
</svg>

